<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArcSkyDev</title>
<meta name="description" content="ArcSkyDev makes DEAD ON, the daily precision game for Android.">
<style>
  html,body{margin:0;background:#0B0E13;color:#F2F5F7;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;box-sizing:border-box}
  .brand{font-size:13px;letter-spacing:.28em;color:#8A93A6;margin-bottom:28px}
  .ring{width:96px;height:96px;border-radius:50%;border:3px solid #00E5A0;position:relative;margin:0 auto 28px;box-shadow:0 0 40px rgba(0,229,160,.25)}
  .ring:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#00E5A0}
  h1{font-size:44px;letter-spacing:.14em;margin:0 0 8px;font-weight:800}
  p.tag{color:#8A93A6;margin:0 0 36px;max-width:34em}
  a.btn{display:inline-block;background:#00E5A0;color:#0B0E13;font-weight:800;letter-spacing:.06em;text-decoration:none;padding:14px 26px;border-radius:14px}
  a.btn:hover{filter:brightness(1.08)}
  nav{margin-top:44px;font-size:14px}
  nav a{color:#8A93A6;text-decoration:none;margin:0 12px;border-bottom:1px solid #2A3140}
  nav a:hover{color:#F2F5F7}
  footer{margin-top:56px;font-size:12px;color:#5B6478}
</style>
</head>
<body>
<main>
  <div class="brand">ARCSKYDEV</div>
  <div class="ring" aria-hidden="true"></div>
  <h1>DEAD ON</h1>
  <p class="tag">The daily precision game. Twenty-three tiny games of timing, aim and nerve: five a day, the same five for everyone, one attempt each.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=arcsky.steph.deadon">GET IT ON GOOGLE PLAY</a>
  <nav>
    <a href="https://sites.google.com/view/arcskydev-apps-privacy-policy/home">Privacy policy</a>
    <a href="mailto:arcskydev@gmail.com">Contact</a>
  </nav>
  <footer>&copy; 2026 ArcSkyDev</footer>
</main>
</body>
</html>
